<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  table {
    table-layout: auto;
    width: max-content;
    min-width: 100%;
  }
  th, td {
    min-width: 20ch;
    max-width: 30ch;
    word-break: break-word;
    white-space: normal;
  }
</style>
</head>
<body>
 <?!= include("navigation", { url: url, sheetName: sheetName, keys: keys }); ?>
  <div class="container mt-3">
    <h2><?= sheetName ?></h2>
    <input type="text" id="search" class="form-control mb-3" placeholder="All_Columns_Search">
    <? var data = getSheetData(sheetName); ?>
    <div class="table-responsive">
      <table id="myTable" class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <? for (var i = 0; i < data[0].length; i++) { ?>
              <th><?= data[0][i] ?></th>
            <? } ?>
          </tr>
        </thead>
        <tbody>
          <? for (var j = 1; j < data.length; j++) { ?>
            <tr>
              <? for (var k = 0; k < data[j].length; k++) { ?>
                <? var link = safeUrl(data[j][k]); ?>
                <? if (link) { ?>
                   <td><a href="<?= link ?>" target="_blank" rel="noopener noreferrer">URL</a></td>
                <? } else { ?>
                   <td><?= data[j][k] ?></td>
                <? } ?>
              <? } ?>
            </tr>
          <? } ?>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.getElementById("search").addEventListener("input", function() {
      const keyword = this.value.toLowerCase();
      document.querySelectorAll("#myTable tbody tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(keyword) ? "" : "none";
      });
    });
  </script>
</body>
</html>
